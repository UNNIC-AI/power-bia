packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks postinstall scripts unless named here. esbuild needs its
# postinstall to link the platform binary that vitest and vite run through.
allowBuilds:
  esbuild: true

# Single source of truth for third-party versions. Workspace packages depend on
# `catalog:` rather than a range, so a bump happens here once and cannot drift
# between apps/api and apps/web — which matters most for zod and the AI SDK,
# where two copies at different majors break type inference in confusing ways.
catalog:
  # --- AI ---------------------------------------------------------------
  # AI SDK 7 is ESM-only and needs Node 22+. Note the v7 shape: `instructions`
  # rather than `system`, structured output via `Output.object()` (there is no
  # `generateObject`), and stateless stream helpers exported from `ai`.
  ai: ^7.0.64
  "@ai-sdk/openai": ^4.0.41
  "@ai-sdk/react": ^4.0.67

  # --- Backend ----------------------------------------------------------
  fastify: ^5.11.3
  fastify-plugin: ^6.0.0
  fastify-type-provider-zod: ^7.0.0
  "@fastify/cookie": ^11.1.2
  "@fastify/cors": ^11.3.0
  "@fastify/helmet": ^13.1.0
  "@fastify/rate-limit": ^11.2.0
  "@fastify/swagger": ^9.8.1
  pino: ^10.3.1
  pino-pretty: ^13.1.3

  # --- Data -------------------------------------------------------------
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  postgres: ^3.4.9

  # --- Shared -----------------------------------------------------------
  zod: ^4.4.3

  # --- Frontend ---------------------------------------------------------
  react: ^19.2.8
  react-dom: ^19.2.8
  "@tanstack/react-router": ^1.170.27
  "@tanstack/router-plugin": ^1.168.30
  "@tanstack/react-query": ^5.101.4
  recharts: ^3.10.1
  react-grid-layout: ^2.2.4
  i18next: ^26.3.6
  react-i18next: ^17.0.11
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  daisyui: ^5.7.16
  vite: ^8.2.1
  "@vitejs/plugin-react": ^6.0.5

  # --- Tooling ----------------------------------------------------------
  typescript: ^5.9.3
  "@biomejs/biome": ^2.5.8
  turbo: ^2.10.9
  vitest: ^4.1.10
  tsx: ^4.23.12
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.51'
  - '@ai-sdk/openai@4.0.41'
  - ai@7.0.64
  - '@ai-sdk/react@4.0.67'
